<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>趣味人格测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .title {
            text-align: center;
            font-size: 28px;
            color: #444;
            margin-bottom: 10px;
        }
        .desc {
            text-align: center;
            color: #777;
            margin-bottom: 20px;
        }
        .timer-text {
            text-align: center;
            color: #667eea;
            font-weight: 500;
            margin-bottom: 16px;
        }
        .progress-bar-wrap {
            width: 100%;
            height: 8px;
            background-color: #eee;
            border-radius: 999px;
            margin-bottom: 24px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }
        .question-item {
            margin-bottom: 24px;
        }
        .q-title {
            font-size: 17px;
            margin-bottom: 12px;
            line-height: 1.6;
        }
        .option {
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option:hover {
            border-color: #667eea;
            background: #f4f6ff;
        }
        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .btn-wrap {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }
        button {
            padding: 12px 28px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        #prevBtn {
            background: #eee;
            color: #555;
        }
        #nextBtn, #submitBtn, #restartBtn, #downloadBtn {
            background: #667eea;
            color: white;
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .result-box {
            text-align: center;
            padding: 20px 10px;
        }
        .result-type {
            font-size: 42px;
            font-weight: bold;
            color: #667eea;
            margin: 15px 0;
        }
        .result-name {
            font-size: 22px;
            margin-bottom: 16px;
        }
        .result-desc {
            line-height: 1.8;
            color: #555;
            font-size: 16px;
        }
        .result-actions {
            display: flex;
            gap:12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top:24px;
        }
        #posterCanvas {
            display: none;
        }
        .poster-preview-wrap {
            margin:20px auto;
        }
        #posterPreview {
            max-width: 320px;
            border-radius:12px;
            box-shadow:0 4px 16px rgba(0,0,0,0.12);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">趣味人格小测试</h1>
        <p class="desc">一共10道题目，凭第一直觉选择，查看你的人格类型</p>
        <div class="timer-text" id="timer">答题用时：00:00</div>
        <div class="progress-bar-wrap">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div id="questionPages">
        </div>

        <div id="resultPage" class="page">
            <div class="result-box">
                <div class="result-type" id="resType"></div>
                <div class="result-name" id="resName"></div>
                <div class="result-desc" id="resDesc"></div>
                <div class="poster-preview-wrap">
                    <img id="posterPreview" />
                </div>
                <div class="result-actions">
                    <button id="downloadBtn">下载结果海报</button>
                    <button id="restartBtn">重新测试</button>
                </div>
                <canvas id="posterCanvas"></canvas>
            </div>
        </div>
    </div>

<script>
const questions = [
    {
        title: "聚会结束之后，你一般会？",
        options: [
            {text: "觉得疲惫，想要一个人安静休息", score: {I:1}},
            {text: "心情很好，还想继续聊天社交", score: {E:1}}
        ]
    },
    {
        title: "做计划的时候，你更相信？",
        options: [
            {text: "真实的经验、看得见的事实", score: {S:1}},
            {text: "直觉、灵感和各种可能性", score: {N:1}}
        ]
    },
    {
        title: "空闲时间，你更喜欢？",
        options: [
            {text: "看书、追剧，独自待着", score: {I:1}},
            {text: "约朋友出门，参加活动", score: {E:1}}
        ]
    },
    {
        title: "学习新事物，你偏好？",
        options: [
            {text: "先看细节，一步步动手实操", score: {S:1}},
            {text: "先理解整体思路和脑洞方向", score: {N:1}}
        ]
    },
    {
        title: "心里有烦恼的时候，你习惯？",
        options: [
            {text: "自己消化，很少主动找人倾诉", score: {I:1}},
            {text: "找人聊聊，倾诉释放情绪", score: {E:1}}
        ]
    },
    {
        title: "看故事的时候，你更容易关注？",
        options: [
            {text: "真实发生的情节和细节", score: {S:1}},
            {text: "背后的隐喻、伏笔和想象空间", score: {N:1}}
        ]
    },
    {
        title: "认识新朋友，你通常？",
        options: [
            {text: "比较慢热，熟悉之后才放开", score: {I:1}},
            {text: "主动搭话，很快就能熟络", score: {E:1}}
        ]
    },
    {
        title: "别人给你建议，你优先考虑？",
        options: [
            {text: "现实能不能落地、有没有先例", score: {S:1}},
            {text: "想法是否新颖、未来的潜力", score: {N:1}}
        ]
    },
    {
        title: "压力很大的时候，你会？",
        options: [
            {text: "独处冷静，自己慢慢梳理", score: {I:1}},
            {text: "找人陪伴交流，缓解压力", score: {E:1}}
        ]
    },
    {
        title: "畅想未来生活，你更喜欢？",
        options: [
            {text: "安稳踏实、看得见的生活", score: {S:1}},
            {text: "充满变化、充满未知的新体验", score: {N:1}}
        ]
    }
]

const resultMap = {
    "IS": {
        name: "沉静务实者",
        desc: "你稳重内敛，注重现实，做事踏实靠谱。不喜欢浮夸的社交，喜欢脚踏实地做好每件事，是身边人可靠的后盾。你相信眼见为实，偏爱稳定有序的生活。"
    },
    "IN": {
        name: "内省空想家",
        desc: "你的内心世界十分丰富，喜欢思考、脑洞很大。习惯独处，善于捕捉灵感，常常沉浸在自己的想法里，对事物背后的深层意义很感兴趣。"
    },
    "ES": {
        name: "热情实干家",
        desc: "你外向开朗，接地气，很擅长与人打交道。重视真实体验，行动力很强，善于带动周围氛围，喜欢看得见、摸得着的成果。"
    },
    "EN": {
        name: "活力探索家",
        desc: "你乐观外向，脑洞丰富，热爱新鲜事物。擅长社交，想法天马行空，喜欢探索各种各样的可能性，感染力很强。"
    }
}

let currentPage = 0;
let answers = Array(questions.length).fill(null);
const totalQ = questions.length;
const wrap = document.getElementById("questionPages");
const resultPage = document.getElementById("resultPage");
const progressBar = document.getElementById("progressBar");

let startTime = null;
let timerInterval = null;
const timerDom = document.getElementById("timer");

function startTimer(){
    startTime = Date.now();
    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(()=>{
        const diff = Math.floor((Date.now() - startTime)/1000);
        const m = String(Math.floor(diff/60)).padStart(2,'0');
        const s = String(diff % 60).padStart(2,'0');
        timerDom.innerText = `答题用时：${m}:${s}`;
    }, 1000);
}
function stopTimer(){
    clearInterval(timerInterval);
}

function updateProgress(){
    const doneCount = answers.filter(x=>x!==null).length;
    const pct = (doneCount / totalQ) * 100;
    progressBar.style.width = pct + "%";
}

function renderQuestions(){
    wrap.innerHTML = "";
    questions.forEach((q, idx)=>{
        const pageDiv = document.createElement("div");
        pageDiv.className = "page";
        if(idx === currentPage) pageDiv.classList.add("active");
        pageDiv.innerHTML = `
            <div class="question-item">
                <div class="q-title">${q.title}</div>
                ${q.options.map((opt, optIdx)=>`
                    <div class="option ${answers[idx] === optIdx ? 'selected' : ''}" data-q="${idx}" data-opt="${optIdx}">${opt.text}</div>
                `).join('')}
            </div>
            <div class="btn-wrap">
                <button id="prevBtn" ${idx===0 ? 'disabled' : ''}>上一题</button>
                ${idx === totalQ-1
                    ? `<button id="submitBtn" ${answers[idx]==null ? 'disabled':''}>查看结果</button>`
                    : `<button id="nextBtn" ${answers[idx]==null ? 'disabled':''}>下一题</button>`
                }
            </div>
        `
        wrap.appendChild(pageDiv);
    })

    document.querySelectorAll(".option").forEach(el=>{
        el.onclick = ()=>{
            const qIdx = Number(el.dataset.q);
            const optIdx = Number(el.dataset.opt);
            answers[qIdx] = optIdx;
            updateProgress();
            renderQuestions();
        }
    })

    const prevBtn = document.getElementById("prevBtn");
    if(prevBtn){
        prevBtn.onclick = ()=>{
            currentPage--;
            switchPage();
        }
    }
    const nextBtn = document.getElementById("nextBtn");
    if(nextBtn){
        nextBtn.onclick = ()=>{
            currentPage++;
            switchPage();
        }
    }
    const submitBtn = document.getElementById("submitBtn");
    if(submitBtn){
        submitBtn.onclick = calcResult;
    }
}

function switchPage(){
    document.querySelectorAll("#questionPages .page").forEach((p,i)=>{
        p.classList.toggle("active", i === currentPage);
    })
}

function calcResult(){
    stopTimer();
    let score = {I:0,E:0,S:0,N:0};
    answers.forEach((optIdx, qIdx)=>{
        const sel = questions[qIdx].options[optIdx];
        for(let key in sel.score){
            score[key] += sel.score[key];
        }
    })
    let ie = score.E > score.I ? "E" : "I";
    let sn = score.N > score.S ? "N" : "S";
    const typeKey = ie + sn;
    const res = resultMap[typeKey];

    wrap.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    resultPage.classList.add("active");
    document.getElementById("resType").innerText = typeKey;
    document.getElementById("resName").innerText = res.name;
    document.getElementById("resDesc").innerText = res.desc;

    drawPoster(typeKey, res.name, res.desc, timerDom.innerText);
}

function drawPoster(type, name, desc, timeText){
    const canvas = document.getElementById("posterCanvas");
    const ctx = canvas.getContext("2d");
    const w = 600;
    const h = 900;
    canvas.width = w;
    canvas.height = h;

    const grad = ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0, '#667eea');
    grad.addColorStop(1, '#764ba2');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);

    ctx.fillStyle="#fff";
    ctx.font="bold 42px Microsoft Yahei";
    ctx.textAlign="center";
    ctx.fillText(type, w/2, 160);

    ctx.font="bold 26px Microsoft Yahei";
    ctx.fillText(name, w/2, 210);

    ctx.font="18px Microsoft Yahei";
    ctx.fillText(timeText, w/2, 260);

    ctx.textAlign="left";
    ctx.font="18px Microsoft Yahei";
    const maxW = 480;
    const lineH = 34;
    let x = 60;
    let y = 340;
    const words = desc.split("");
    let line = "";
    for(let char of words){
        const testLine = line + char;
        if(ctx.measureText(testLine).width > maxW){
            ctx.fillText(line, x, y);
            line = char;
            y += lineH;
        }else{
            line = testLine;
        }
    }
    ctx.fillText(line, x, y);

    ctx.fillStyle="#ffffffbb";
    ctx.textAlign="center";
    ctx.font="16px Microsoft Yahei";
    ctx.fillText("趣味人格测试 · 测测你的人格", w/2, h-80);

    const imgUrl = canvas.toDataURL("image/png");
    document.getElementById("posterPreview").src = imgUrl;

    document.getElementById("downloadBtn").onclick = ()=>{
        const a = document.createElement("a");
        a.href = imgUrl;
        a.download = `人格测试结果_${type}.png`;
        a.click();
    }
}

document.getElementById("restartBtn").onclick = ()=>{
    currentPage = 0;
    answers = Array(totalQ).fill(null);
    resultPage.classList.remove("active");
    updateProgress();
    startTimer();
    renderQuestions();
}

updateProgress();
startTimer();
renderQuestions();
</script>
</body>
</html>
